[alias]
xtask = "run --target x86_64-unknown-linux-gnu -p xtask --"

# ============================================================
# Golden-path developer on-ramp (Phase 1)
# ============================================================
#
#   cargo xtask run --arch x86_64
#
# That single command builds the kernel, stages the UEFI ESP,
# assembles boot-x86_64.img, resolves OVMF firmware (auto-
# downloading if needed), and launches qemu-system-x86_64 with
# serial output on stdout.
#
# See docs/getting-started.md for the full on-ramp guide.
# ============================================================

# Plain `cargo build` builds the repository-default boot artifact:
# the aarch64 UEFI loader/application.  Use `cargo xtask image
# --arch aarch64` when you need the FAT ESP image.
#
# x86_64 and riscv64 remain explicit targets:
#   cargo xtask build --arch x86_64
#   cargo xtask build --arch riscv64 --boot sbi
[build]
target = "targets/aarch64-uefi-loader.json"

# Freestanding kernel builds require -Z build-std. xtask injects
# those flags only for kernel cargo invocations so the host xtask
# binary can compile with the normal std toolchain.
