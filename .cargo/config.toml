[alias]
xtask = "run -Z build-std=std,panic_abort --target x86_64-unknown-linux-gnu -p xtask --"

# ============================================================
# Boot target overview
# ============================================================
#
# PRIMARY   — x86_64 UEFI  (x86_64-unknown-uefi)
# SECONDARY — aarch64 UEFI (aarch64-unknown-uefi)
#
# Both produce PE/COFF UEFI applications. The firmware calls
# the arch entry point, which runs ExitBootServices and tail-
# calls kernel_main via a stack-switch trampoline.
#
# Bare-metal ELF variants (for QEMU -kernel / U-Boot direct
# load) live in targets/x86_64-kernel.json and
# targets/aarch64-kernel.json; those use custom JSON specs and
# ELF linker scripts, so invoke them through xtask or pass
# `-Z json-target-spec` explicitly:
#
#   cargo build -Z json-target-spec --target targets/x86_64-kernel.json
#   cargo build -Z json-target-spec --target targets/aarch64-kernel.json
#
# ============================================================
# Developer on-ramp
# ============================================================
#
# Plain `cargo build` builds the lean x86_64 UEFI image (PRIMARY).
#
# To build the aarch64 UEFI image:
#   cargo xtask build --arch aarch64
#   -- or --
#   cargo build --target aarch64-unknown-uefi
#
# To run in QEMU (downloads OVMF automatically if needed):
#   cargo xtask run --arch x86_64
#   cargo xtask run --arch aarch64
#
# To run host-side Rust unit tests, use xtask instead of raw `cargo test`.
# Raw `cargo test` inherits the default UEFI target below, which does not
# provide the standard `test` runtime:
#   cargo xtask test
#
# See docs/getting-started.md for the full guide.
# ============================================================

[build]
target = "x86_64-unknown-uefi"

# Freestanding kernel builds require build-std on nightly. Keeping the
# defaults here makes plain `cargo check` / `cargo build` exercise the same
# lean x86_64 UEFI image as `cargo xtask check --arch x86_64`.
[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
