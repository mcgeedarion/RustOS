name: Kernel stack ownership regressions

on:
  push:
    branches: [fix/kernel-allocator-exit-signals-pmm]
  pull_request:
    branches: [main]
    paths:
      - src/mm/kstack.rs
      - src/mm/kstack/**
      - scripts/ci/test-kstack-ownership.sh
      - .github/workflows/kstack-ownership.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: rust-src
      - name: Test ownership and retirement state machine
        run: bash scripts/ci/test-kstack-ownership.sh
      - name: Check canonical x86_64 kernel
        if: ${{ !cancelled() }}
        run: cargo xtask check --arch x86_64
