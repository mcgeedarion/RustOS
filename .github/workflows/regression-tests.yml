name: Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-profiles:
    uses: ./.github/workflows/focused-regressions.yml

  coverage-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Describe supported regression coverage
        run: |
          {
            echo "## Supported regression suites"
            echo "This workflow reuses the executable host tests and UEFI profile build matrix."
            echo "Filesystem/IPC/scheduler runtime suites, fuzz targets, and syscall benchmarks remain unsupported."
            echo "The previous workflow referenced absent scripts and a nonexistent Rust setup action."
            echo "No coverage percentage or full-kernel integration success is claimed."
          } >> "$GITHUB_STEP_SUMMARY"
