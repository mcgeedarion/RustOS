name: Boot Smoke

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref so force-pushes don't queue up.
concurrency:
  group: boot-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Reusable cache key fragment: OS + toolchain date + Cargo.lock hash.
# All three jobs share the same scheme so they can warm each other's cache.
# ---------------------------------------------------------------------------
env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation in CI — not worth the cache churn.
  CARGO_INCREMENTAL: "0"
  # Use a deterministic sysroot path for build-std caching.
  RUSTFLAGS: ""

jobs:
  # -------------------------------------------------------------------------
  # x86_64 UEFI — primary smoke gate
  # -------------------------------------------------------------------------
  x86_64-uefi:
    name: x86_64 UEFI boot smoke (release-boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Rust toolchain — reads rust-toolchain.toml automatically.
      # rustflags: "" prevents the action from injecting -D warnings which
      # breaks freestanding / no_std builds that use allow() internally.
      # ------------------------------------------------------------------
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: rust-src, llvm-tools-preview

      # ------------------------------------------------------------------
      # Cargo artifact cache
      #
      # Three distinct layers:
      #   1. ~/.cargo/registry  — downloaded crate sources (rarely changes)
      #   2. ~/.cargo/git       — git-sourced deps (rarely changes)
      #   3. target/            — compiled artifacts (keyed on Cargo.lock)
      #
      # The target/ key includes the toolchain channel so a nightly bump
      # gets a fresh cache rather than linking against stale artifacts.
      # ------------------------------------------------------------------
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-target-x86_64-uefi-release-boot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-x86_64-uefi-release-boot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-x86_64-uefi-release-boot-${{ runner.os }}-

      # ------------------------------------------------------------------
      # System dependencies
      # ovmf       — UEFI firmware (OVMF_CODE.fd / OVMF_VARS.fd)
      # mtools     — mcopy/mformat for FAT ESP image assembly
      # qemu-system-x86 — qemu-system-x86_64
      # ------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-x86 \
            ovmf \
            mtools

      # ------------------------------------------------------------------
      # Build — lean release-boot profile:
      #   cargo xtask build --arch x86_64 --profile release-boot
      # ------------------------------------------------------------------
      - name: Build x86_64 UEFI kernel (release-boot)
        run: |
          set -o pipefail
          cargo xtask build --arch x86_64 --profile release-boot 2>&1 | tee cargo-build-x86_64-release-boot.log

      # ------------------------------------------------------------------
      # Assemble FAT16 ESP disk image → boot-x86_64.img
      # ------------------------------------------------------------------
      - name: Assemble x86_64 UEFI ESP image (release-boot)
        run: |
          set -o pipefail
          cargo xtask image --arch x86_64 --profile release-boot 2>&1 | tee build-x86_64-image-release-boot.log
          test -f boot-x86_64.img || { echo "ERROR: boot-x86_64.img not produced" >&2; exit 1; }

      # ------------------------------------------------------------------
      # Boot under QEMU/OVMF — 60 s timeout
      # ------------------------------------------------------------------
      - name: Boot release-boot image in QEMU/OVMF
        run: |
          find_existing_file() {
            for path in "$@"; do
              [ -f "$path" ] && { echo "$path"; return 0; }
            done
            return 1
          }

          OVMF_CODE=$(find_existing_file \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/ovmf/OVMF.fd \
            /usr/share/qemu/OVMF.fd) || {
            echo "ERROR: OVMF firmware not found" >&2
            exit 1
          }
          echo "Using OVMF firmware: $OVMF_CODE"

          # Optional writable VARS image (enables full UEFI variable store).
          OVMF_VAR_ARGS=()
          if OVMF_VARS_TMPL=$(find_existing_file \
              /usr/share/OVMF/OVMF_VARS.fd \
              /usr/share/OVMF/OVMF_VARS_4M.fd); then
            cp "$OVMF_VARS_TMPL" /tmp/OVMF_VARS.fd
            OVMF_VAR_ARGS=(-drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd)
          fi

          set +e
          timeout 60 qemu-system-x86_64 \
            -machine q35 \
            -cpu qemu64,+xsave,+avx \
            -m 256M \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            "${OVMF_VAR_ARGS[@]}" \
            -drive if=virtio,format=raw,file=boot-x86_64.img \
            -netdev user,id=net0,net=10.0.2.0/24,host=10.0.2.2,dns=10.0.2.3,dhcpstart=10.0.2.15 \
            -device virtio-net-pci,netdev=net0,id=nic0 \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,cpu_reset \
            > qemu-x86_64-boot-release-boot.log 2>&1
          QEMU_STATUS=$?
          set -e

          echo "--- QEMU serial output (release-boot) ---"
          cat qemu-x86_64-boot-release-boot.log
          echo "--- end QEMU output (exit $QEMU_STATUS) ---"

          # Allow clean exit (0) or timeout (124); anything else is a crash.
          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "ERROR: QEMU exited unexpectedly with status $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi

      # ------------------------------------------------------------------
      # Sentinel assertion — THE canonical CI gate for release-boot.
      # ------------------------------------------------------------------
      - name: "Assert boot sentinel: RUSTOS_BOOT_OK"
        run: |
          if ! grep -q 'RUSTOS_BOOT_OK' qemu-x86_64-boot-release-boot.log; then
            echo "FAIL: sentinel 'RUSTOS_BOOT_OK' not found in serial output (release-boot)." >&2
            echo "      Boot did not reach the expected checkpoint within 60 s." >&2
            echo "" >&2
            echo "Last 30 lines of serial output:" >&2
            tail -30 qemu-x86_64-boot-release-boot.log >&2
            exit 1
          fi
          echo "OK: RUSTOS_BOOT_OK sentinel found in release-boot image."

      # ------------------------------------------------------------------
      # Upload logs on every run (success or failure) for post-mortem.
      # ------------------------------------------------------------------
      - name: Upload x86_64 boot logs (release-boot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-boot-smoke-release-boot
          path: |
            cargo-build-x86_64-release-boot.log
            build-x86_64-image-release-boot.log
            qemu-x86_64-boot-release-boot.log

  # aarch64 job continues to use the boot_minimal debug image and BOOT_MINIMAL_OK sentinel.
