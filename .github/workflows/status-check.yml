name: status-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Validate roadmap coverage
        run: cargo xtask roadmap-check
