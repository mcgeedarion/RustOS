name: panic-format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-panic-output:
    name: Panic output (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: rust-src
      - name: Install QEMU and firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
      - name: Build the supported diagnostic profile without an initramfs
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/panic-target" >> "$GITHUB_ENV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/panic-target" \
            cargo build --locked --target "${ARCH}-unknown-uefi"
      - name: Capture an intentional missing-initramfs panic
        run: |
          esp="$RUNNER_TEMP/panic-esp"
          mkdir -p "$esp/EFI/BOOT"
          if [ "$ARCH" = x86_64 ]; then
            cp "$CARGO_TARGET_DIR/$ARCH-unknown-uefi/debug/rustos.efi" "$esp/EFI/BOOT/BOOTX64.EFI"
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "$RUNNER_TEMP/panic-vars.fd"
            qemu=(qemu-system-x86_64 -machine q35 -cpu qemu64,+xsave,+avx
              -drive "if=virtio,format=raw,file=fat:rw:$esp")
          else
            cp "$CARGO_TARGET_DIR/$ARCH-unknown-uefi/debug/rustos.efi" "$esp/EFI/BOOT/BOOTAA64.EFI"
            code=/usr/share/AAVMF/AAVMF_CODE.fd
            cp /usr/share/AAVMF/AAVMF_VARS.fd "$RUNNER_TEMP/panic-vars.fd"
            qemu=(qemu-system-aarch64 -machine virt -cpu cortex-a57
              -drive "if=none,id=esp,format=raw,file=fat:rw:$esp"
              -device virtio-blk-device,drive=esp)
          fi
          set +e
          timeout 30 "${qemu[@]}" -accel tcg -m 256M \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=$RUNNER_TEMP/panic-vars.fd" \
            -serial file:serial.log -display none -no-reboot -no-shutdown
          status=$?
          set -e
          cat serial.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Validate the real structured panic
        run: python3 scripts/ci/panic_output.py serial.log --arch "$ARCH"
      - name: Save serial output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panic-output-${{ matrix.arch }}
          path: serial.log
