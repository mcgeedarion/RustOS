name: Fault Injection Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Fault injection engine (host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Test the actual fault-point engine
        run: |
          rustc --edition=2021 --test --cfg 'feature="fault-inject"' \
            scripts/ci/tests/fault_engine.rs -o "$RUNNER_TEMP/fault-engine-tests"
          "$RUNNER_TEMP/fault-engine-tests" 2>&1 | tee fault-engine-tests.log
      - name: State the coverage boundary
        run: |
          {
            echo "## Fault-injection coverage"
            echo "Host tests exercise the actual atomic fault-point engine."
            echo "PMM/VMM/syscall integration is NOT exercised: supported boot profiles exclude those modules."
            echo "The kernel integration job is explicitly skipped until a real executable harness exists."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fault-injection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-injection-host-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fault-engine-tests.log
            ${{ runner.temp }}/fault-engine-tests

  kernel-integration:
    name: Kernel fault integration (unsupported)
    # Do not turn a minimal/diagnostic boot into a fake PMM/VMM test.
    # Enable only with a working full-kernel harness and mandatory fired/results markers.
    if: ${{ vars.RUSTOS_ENABLE_UNSUPPORTED_KERNEL_FAULT_GATE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
