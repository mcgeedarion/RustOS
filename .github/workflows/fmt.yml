name: fmt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: "rustfmt check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-fmt-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-fmt-

      - name: Check formatting
        run: |
          find src xtask crates -name '*.rs' -print0 \
            | xargs -0 rustfmt --edition 2021 --check
