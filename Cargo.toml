[workspace]
members = [
    ".",
    "xtask",
    "crates/scheme-api",
]
resolver = "2"

[package]
name = "rustos-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Darion McGee"]
description = "A Rust-based operating system"
license = "MIT"
repository = "https://github.com/mcgeedarion/RustOS"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "rustos"
path = "src/main.rs"

[dependencies]
scheme-api = { path = "crates/scheme-api" }

# Synchronisation primitives. `crate::sync::mutex` re-exports `spin::Mutex`,
# and many subsystems use `spin::Mutex` / `spin::Once` directly.
spin = { version = "0.9", default-features = false, features = ["spin_mutex", "rwlock", "once", "lazy"] }

# cfg_if! macro used by various arch-gated modules.
cfg-if = "1"

# log crate used by drivers/firmware/networking code paths.
log = { version = "0.4", default-features = false }

# Add your kernel dependencies here

[build-dependencies]
# Used by build.rs::compile_crt() to build the freestanding C runtime stubs
# (src/init/crt/*.c) into librustos_crt.a and link it into the kernel.
cc = "1"

[features]
# ---------------------------------------------------------------------------
# Default: only the UEFI firmware handoff path is active for plain
# `cargo check` / `cargo xtask build --arch x86_64` runs.
#
# `userspace_boot` must be opted in explicitly via --features userspace_boot
# so that the stub fs/proc shims (and the bump allocator) are clearly
# intentional rather than accidentally compiled into every build.
# ---------------------------------------------------------------------------
default = ["uefi_boot"]

# Compile only the firmware handoff, common BootInfo path, early console,
# panic handler, and an architecture idle loop. This is the first-stage boot
# target used to keep x86_64/aarch64 bring-up paths aligned before
# re-enabling the full kernel services.
boot_minimal = []

# Compile the current full-boot skeleton without the legacy experimental
# subsystems that are still API-inconsistent. This path keeps the firmware
# handoff, common BootInfo path, early console, and a userspace handoff marker
# enabled as the default "boot to userspace" milestone.
#
# NOTE: crate::fs and crate::proc are provided as thin stubs (no-op /
# returns-false) while the real mm/fs/proc stack is still being stabilised.
# See src/lib.rs for the stub definitions and the Phase 3 replacement plan.
userspace_boot = []

# Evdev / virtio-input subsystem.
input_events = []

# Optional AMD GPU GEM backend.
amdgpu = []

# Optional cgroup security/resource modules.
cgroups = []

# GDB Remote Serial Protocol stub.
gdbstub = []

# Build as a UEFI loader/application.
uefi_boot = ["boot_minimal"]


# Full debug build: GDB RSP stub + rich oops/backtrace + trace drain.
# Use `--features debug` as the single flag for a debug kernel.
debug = ["gdbstub", "trace"]

# Backwards-compatible alias for builds that still request `debugstub`.
debugstub = ["gdbstub"]

# Ring-buffer trace event drain, flushed to serial on panic.
trace = []

# Optional in-kernel test harness.
kmtest = []

# ---------------------------------------------------------------------------
# Fault injection framework (Phase 3 — Stabilize core kernel behavior)
#
# Enables compile-time-gated fault injection into critical subsystems:
#   - PMM: simulate OOM / contiguous-alloc failure
#   - VMM: simulate map failure / region-reservation failure
#   - Syscall paths: simulate resource exhaustion (EAGAIN) and EMFILE
#
# NEVER enable in release/production builds. Combine with `kmtest` to
# run the automated test suite:
#
#   cargo build --features "fault-inject,kmtest" --target <target>
#
# The entire framework (statics, hooks, test cases) compiles to nothing
# when this feature is absent.
# ---------------------------------------------------------------------------
fault-inject = []

# ---------------------------------------------------------------------------
# Syscall profiling / tracing (Phase 5 — Performance and polish)
#
# Enables per-syscall atomic invocation counters and cumulative hardware-cycle
# timing (TSC on x86_64, PMCCNTR_EL0 on AArch64).
#
# Profiling data is exposed via /proc/syscall_stats and can be dumped to the
# debug serial port on demand via dump_syscall_stats().
#
# OFF BY DEFAULT — zero overhead (all hooks are #[inline(always)] no-ops)
# when this feature is absent. Never enable in benchmarked release builds
# unless you intend to collect profile data.
#
#   cargo build --features "syscall-trace,userspace_boot" --target <target>
# ---------------------------------------------------------------------------
syscall-trace = []

# ---------------------------------------------------------------------------
# Meta-features for build profiles.
#
# `release-boot` is the lean CI / normal-boot image:
#   - No kmtest harness
#   - No fault-inject framework
#   - No syscall-trace profiling hooks
#   - No GDB stub or trace ring buffer
#
# Debug and profiling images opt into these explicitly via `--features`.
# ---------------------------------------------------------------------------
release-boot = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.release-boot]
inherits = "release"
# No DWARF / debuginfo for the boot image; keep symbols in separate debug builds.
debug = 0
# Make sure cfg(debug_assertions) is off even if other profiles flip it on.
debug-assertions = false
# Optimise for size; LTO + single codegen unit keeps hot paths inlined.
opt-level = "z"
lto = "fat"
codegen-units = 1
# Strip debuginfo and most symbol names from the final binary.
strip = "debuginfo"

[profile.dev]
opt-level = 0

[package.metadata.docs.rs]
all-features = true
