[package]
name = "rustos-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Darion McGee"]
description = "Freestanding RustOS syscall microbenchmark"

[workspace]

[[bin]]
name = "bench"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
