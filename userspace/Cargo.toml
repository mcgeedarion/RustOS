# RustOS Userspace Cargo Workspace
# 
# This workspace builds all userspace binaries as #![no_std] Rust targets.
# The xtask tool orchestrates cross-compilation for multiple architectures.
#
# Usage:
#   cargo build --release --target x86_64-unknown-none
#   cargo build --release --target aarch64-unknown-none
#   cargo build --release --target riscv64gc-unknown-none
#
# Or via xtask:
#   cargo xtask build-userspace --arch x86_64
#   cargo xtask build-userspace --arch aarch64
#   cargo xtask build-userspace --arch riscv64

[workspace]
resolver = "2"
members = [
    "init",
    "hello",
    "smoke",
    "kmtest",
    "libc-shim",
    # "wayland",  # TODO: Port Wayland compositor to Rust (longer-term)
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RustOS Contributors"]
repository = "https://github.com/rustos/rustos"

# Common dependencies for all workspace members
[workspace.dependencies]
libc-shim = { path = "libc-shim" }

# Profile optimized for minimal binary size
[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip symbols
panic = "abort"        # Abort on panic (no unwinding in no_std)

# Dev profile with abort on panic
[profile.dev]
panic = "abort"

# Extra-lean profile for boot images
[profile.release-boot]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 4
