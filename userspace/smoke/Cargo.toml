[package]
name = "rustos-smoke"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Darion McGee"]
description = "Freestanding RustOS userspace syscall smoke workload"

# Build as an independent freestanding binary, like userspace/init. This keeps
# it out of host workspace tests and lets xtask select an explicit target ABI.
[workspace]

[[bin]]
name = "smoke"
path = "src/main.rs"

[dependencies]
raw-syscall = { path = "../raw-syscall" }
